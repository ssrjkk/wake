<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover нужен не для красоты: без него вебвью не сообщает
         странице выемки экрана, нижняя панель вкладок ложится под жест возврата,
         а Telegram со своими safeAreaInset становится слепым. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wake — терминал Lighter: перпы, копи-трейдинг, Predict</title>
    <meta
      name="description"
      content="Wake — интерфейс к Lighter: свечи и лента сделок напрямую с публичного REST, копи-трейдинг с dry-run журналом, бинарные Predict-рынки на LMSR, анализ риска и funding-арбитраж. Вход через Telegram или кошелёк."
    />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- %SITE_URL% и %LIGHTER_ORIGIN% подставляет сборка (siteMeta в
         vite.config.ts): адрес сайта берётся из VITE_SITE_URL с дефолтом на
         Pages, узел Lighter — из того же модуля, который читает клиент. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <!-- Первый запрос к площадке идёт сразу после гидратации, и без этого тега
         он платит DNS + TLS руками: хост в HTML тот же, к которому обращается
         src/lib/lighter.ts, поэтому соединение греется не впустую. -->
    <link rel="preconnect" href="%LIGHTER_ORIGIN%" />
    <!-- Шрифты лежат в самом проекте и приходят из бандла (см. src/main.tsx):
         третьего origin в критическом пути нет, и метрики на машине автора и на
         раннере — одни и те же файлы, а не два разных системных фолбэка. -->
    <!-- Превью ссылки: карточка появляется там, где адрес вставляют — в чате
         Telegram, в ответе бота, в мессенджерах и закладках. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wake" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Wake — терминал Lighter" />
    <meta
      property="og:description"
      content="Перпы и споты Lighter, копи-трейдинг, Predict-рынки, риск и funding — в одном интерфейсе. Данные из публичного API Lighter, без посредников."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wake — тёмная карточка: логотип, заголовок «Терминал Lighter: перпы, копи-трейдинг и бинарные Predict-рынки» и строка вкладок Обзор, Терминал, Discover, Портфель, Earn, Predict, Агент, Risk, Funding" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wake — терминал Lighter" />
    <meta
      name="twitter:description"
      content="Перпы и споты Lighter, копи-трейдинг, Predict-рынки, риск и funding — в одном интерфейсе."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <style>
      html { background-color: #0b0b0c; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
