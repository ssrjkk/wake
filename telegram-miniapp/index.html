<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Wake</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --tg-bg: var(--tg-theme-bg-color, #020617);
    --tg-text: var(--tg-theme-text-color, #e2e8f0);
    --tg-hint: var(--tg-theme-hint-color, #64748b);
    --tg-button: var(--tg-theme-button-color, #22d3ee);
    --tg-button-text: var(--tg-theme-button-text-color, #020617);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--tg-bg);
    color: var(--tg-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; border-bottom: 1px solid #1e293b;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; }
  .brand .dot { width: 24px; height: 24px; border-radius: 8px; background: #22d3ee; display: flex; align-items: center; justify-content: center; color: #020617; font-weight: 800; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px; overflow-x: auto; border-bottom: 1px solid #1e293b; }
  .tab { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; white-space: nowrap; background: none; border: none; color: var(--tg-hint); cursor: pointer; }
  .tab.active { background: #1e293b; color: #22d3ee; }
  .content { padding: 14px; }
  .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .price { font-family: ui-monospace, monospace; font-size: 26px; font-weight: 700; }
  .change-up { color: #34d399; } .change-down { color: #f87171; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .muted { color: var(--tg-hint); font-size: 12px; }
  .market-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; font-family: ui-monospace, monospace; font-size: 13px; }
  .market-row:last-child { border-bottom: none; }
  .bar-bg { flex: 1; height: 6px; background: #1e293b; border-radius: 999px; overflow: hidden; margin: 0 10px; }
  .bar-fill { height: 100%; background: #34d399; }
  .btn { background: var(--tg-button); color: var(--tg-button-text); border: none; border-radius: 12px; padding: 10px; font-weight: 600; font-size: 13px; flex: 1; cursor: pointer; }
  .btn-yes { background: #34d399; } .btn-no { background: #f87171; }
  .skeleton { background: #1e293b; border-radius: 6px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .4 } 50% { opacity: .8 } }
  .empty { text-align: center; padding: 40px 20px; color: var(--tg-hint); font-size: 14px; }
</style>
</head>
<body>
  <div class="header">
    <div class="brand"><span class="dot">W</span> Wake</div>
    <span class="muted" id="net-status">Lighter · testnet</span>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="terminal">Терминал</button>
    <button class="tab" data-tab="predict">Predict</button>
    <button class="tab" data-tab="perp">Перп</button>
  </div>
  <div class="content" id="content"></div>

<script>
// Реальный Telegram WebApp SDK — не имитация. Работает только внутри
// Telegram-клиента; вне него tg.* методы просто отсутствуют, поэтому
// весь код ниже defensive (проверяет наличие window.Telegram перед использованием).
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  document.body.style.background = tg.themeParams.bg_color || "#020617";
}

const LIGHTER_API = "https://testnet.zklighter.elliot.ai/api/v1"; // testnet по умолчанию, тот же принцип, что весь проект
const WAKE_BACKEND = "http://localhost:8000"; // заменить на реальный домен при деплое

let currentTab = "terminal";
const content = document.getElementById("content");

function skeleton(h) {
  return `<div class="skeleton" style="height:${h}px;margin-bottom:8px"></div>`;
}

async function renderTerminal() {
  content.innerHTML = skeleton(80) + skeleton(200);
  try {
    const [booksRes, candlesRes] = await Promise.all([
      fetch(`${LIGHTER_API}/orderBooks?filter=perp`),
      fetch(`${LIGHTER_API}/candles?market_id=1&resolution=1h&start_timestamp=0&end_timestamp=${Date.now()}&count_back=24&set_timestamp_to_end=true`),
    ]);
    if (!booksRes.ok) throw new Error(booksRes.status);
    const books = await booksRes.json();
    const markets = (books.order_books || []).slice(0, 30);

    let sparkline = "";
    if (candlesRes.ok) {
      const candles = (await candlesRes.json()).c || [];
      if (candles.length > 1) {
        const closes = candles.map(c => c.c);
        const min = Math.min(...closes), max = Math.max(...closes);
        const range = max - min || 1;
        const points = closes.map((c, i) => `${(i / (closes.length - 1)) * 300},${60 - ((c - min) / range) * 55}`).join(" ");
        const up = closes[closes.length - 1] >= closes[0];
        sparkline = `
          <div class="row" style="margin-bottom:4px">
            <span class="price">$${closes[closes.length - 1].toLocaleString()}</span>
            <span class="${up ? "change-up" : "change-down"}">${up ? "▲" : "▼"} BTC-PERP · 24ч</span>
          </div>
          <svg viewBox="0 0 300 60" style="width:100%;height:60px">
            <polyline points="${points}" fill="none" stroke="${up ? "#34d399" : "#f87171"}" stroke-width="2" />
          </svg>`;
      }
    }

    content.innerHTML = `
      <div class="card">${sparkline || '<div class="muted">Свечи временно недоступны</div>'}</div>
      <div class="card">
        <div class="muted">Живые рынки Lighter · testnet (${markets.length})</div>
        <div style="margin-top:8px">
          ${markets.map(m => `
            <div class="market-row">
              <span>${m.symbol}${m.market_type === "spot" ? " (spot)" : ""}</span>
              <span class="muted">taker ${m.taker_fee}</span>
            </div>`).join("")}
        </div>
      </div>
      <div class="muted" style="text-align:center;margin-top:8px">Исполнение ордеров — в полной версии (нужен signing_service)</div>
    `;
  } catch (e) {
    content.innerHTML = `<div class="empty">Lighter API недоступен из этого окружения.<br/><span class="muted">${e}</span></div>`;
  }
}

function tgUserId() {
  // Реальный Telegram user id из initData — используется как временный идентификатор,
  // пока нет полноценной привязки кошелька внутри Telegram WebView (см. README мини-аппа
  // про ограничение: MetaMask/wagmi плохо работают внутри Telegram-вебвью на мобильных).
  return tg?.initDataUnsafe?.user?.id ? `tg:${tg.initDataUnsafe.user.id}` : null;
}

async function tryPredictTrade(marketId, outcome, btn) {
  tgHaptic();
  const userId = tgUserId();
  if (!userId) {
    alert("Открой это внутри Telegram, чтобы определить пользователя (вне Telegram user id недоступен)");
    return;
  }
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const res = await fetch(`${WAKE_BACKEND}/predict/markets/${marketId}/trade`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, outcome, shares: 10 }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    tg?.HapticFeedback?.notificationOccurred("success");
    alert(`Куплено 10 ${outcome.toUpperCase()}: $${data.cost_usd.toFixed(2)}`);
  } catch (e) {
    tg?.HapticFeedback?.notificationOccurred("error");
    alert(`Backend недоступен (ожидаемо вне локального запуска): ${String(e).slice(0, 100)}`);
  } finally {
    btn.disabled = false;
    btn.textContent = outcome.toUpperCase();
  }
}
window.tryPredictTrade = tryPredictTrade;

async function renderPredict() {
  content.innerHTML = skeleton(90) + skeleton(90);
  try {
    const res = await fetch(`${WAKE_BACKEND}/predict/markets`);
    if (!res.ok) throw new Error(res.status);
    const markets = await res.json();
    if (markets.length === 0) {
      content.innerHTML = `<div class="empty">Открытых рынков пока нет</div>`;
      return;
    }
    content.innerHTML = markets.map(m => `
      <div class="card">
        <div style="font-size:14px;margin-bottom:8px">${m.question}</div>
        <div class="row">
          <span class="muted" style="width:70px">${(m.price_yes*100).toFixed(0)}% YES</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${(m.price_yes*100).toFixed(0)}%"></div></div>
        </div>
        <div class="row" style="margin-top:10px;gap:8px">
          <button class="btn btn-yes" onclick="tryPredictTrade('${m.id}','yes',this)">YES</button>
          <button class="btn btn-no" onclick="tryPredictTrade('${m.id}','no',this)">NO</button>
        </div>
      </div>
    `).join("");
  } catch (e) {
    content.innerHTML = `<div class="empty">Wake backend не отвечает на localhost:8000.<br/><span class="muted">Это ожидаемо, если backend/app.py не запущен локально.</span></div>`;
  }
}

function tgHaptic() {
  // Реальный Telegram-специфичный штрих — тактильный отклик, недоступный обычному вебу
  tg?.HapticFeedback?.impactOccurred("light");
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    tgHaptic();
    if (currentTab === "terminal") renderTerminal();
    else if (currentTab === "predict") renderPredict();
    else renderPerp();
  });
});

async function renderPerp() {
  content.innerHTML = skeleton(120) + skeleton(80);
  try {
    const res = await fetch(`${LIGHTER_API}/orderBooks?filter=perp`);
    if (!res.ok) throw new Error(res.status);
    const books = await res.json();
    const markets = (books.order_books || []).slice(0, 20);
    content.innerHTML = `
      <div class="card">
        <div class="muted" style="margin-bottom:8px">Разместить перп-ордер (через signing service)</div>
        <div class="row" style="margin-bottom:8px">
          <span class="muted">Рынок</span>
          <select id="perp-market" style="background:#1e293b;border:1px solid #334155;border-radius:8px;color:var(--tg-text);padding:6px 10px;font-size:13px">
            ${markets.map(m => `<option value="${m.market_id}" data-symbol="${m.symbol}" data-decimals="${m.supported_size_decimals}" data-price-decimals="${m.supported_price_decimals}">${m.symbol}-PERP</option>`).join("")}
          </select>
        </div>
        <div class="row" style="margin-bottom:8px">
          <span class="muted">Сторона</span>
          <div style="display:flex;gap:6px">
            <button class="btn btn-yes" id="perp-long" onclick="setPerpSide('long')">Long</button>
            <button class="btn btn-no" id="perp-short" onclick="setPerpSide('short')">Short</button>
          </div>
        </div>
        <div class="row" style="margin-bottom:8px">
          <span class="muted">Размер USDC</span>
          <input id="perp-size" type="number" value="100" min="1" style="background:#1e293b;border:1px solid #334155;border-radius:8px;color:var(--tg-text);padding:6px 10px;font-size:13px;width:100px">
        </div>
        <button class="btn" id="perp-submit" onclick="submitPerpOrder()">Отправить ордер</button>
        <div id="perp-status" class="muted" style="margin-top:8px"></div>
      </div>
      <div class="muted" style="text-align:center;margin-top:8px">Требует signing_service на localhost:8787 (см. README)</div>
    `;
  } catch (e) {
    content.innerHTML = `<div class="empty">Lighter API недоступен.<br/><span class="muted">${e}</span></div>`;
  }
}

let perpSide = "long";
function setPerpSide(side) {
  perpSide = side;
  document.getElementById("perp-long").style.opacity = side === "long" ? "1" : "0.5";
  document.getElementById("perp-short").style.opacity = side === "short" ? "1" : "0.5";
  tgHaptic();
}

async function submitPerpOrder() {
  const marketSelect = document.getElementById("perp-market");
  const sizeInput = document.getElementById("perp-size");
  const status = document.getElementById("perp-status");
  const btn = document.getElementById("perp-submit");
  const marketId = marketSelect.value;
  const decimals = parseInt(marketSelect.options[marketSelect.selectedIndex].dataset.decimals);
  const priceDecimals = parseInt(marketSelect.options[marketSelect.selectedIndex].dataset.priceDecimals);
  const usdSize = parseFloat(sizeInput.value);
  if (!usdSize || usdSize <= 0) { status.textContent = "Укажи размер"; return; }
  btn.disabled = true;
  status.textContent = "Отправляю…";
  tgHaptic();
  try {
    const bookRes = await fetch(`${LIGHTER_API}/orderBooks?filter=perp`);
    const books = await bookRes.json();
    const market = (books.order_books || []).find(m => m.market_id === parseInt(marketId));
    if (!market) throw new Error("Рынок не найден");
    const priceRes = await fetch(`${LIGHTER_API}/candles?market_id=${marketId}&resolution=1m&start_timestamp=0&end_timestamp=${Date.now()}&count_back=1&set_timestamp_to_end=true`);
    const candles = (await priceRes.json()).c || [];
    const price = candles.length > 0 ? candles[candles.length - 1].c : null;
    if (!price) throw new Error("Цена недоступна");
    const baseAmountFloat = usdSize / price;
    const baseAmount = Math.floor(baseAmountFloat * 10 ** decimals);
    const priceInt = Math.round(price * 10 ** priceDecimals);
    if (baseAmount <= 0) throw new Error("Размер после округления равен нулю");
    const res = await fetch("http://localhost:8787/place-order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        market_index: parseInt(marketId),
        client_order_index: Date.now() % 1_000_000,
        base_amount: baseAmount,
        price: priceInt,
        is_ask: perpSide === "short",
        reduce_only: false,
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    tg?.HapticFeedback?.notificationOccurred("success");
    status.textContent = `Ордер отправлен: ${data.tx_hash}${data.idempotent_replay ? " (идемпотентный повтор)" : ""}`;
  } catch (e) {
    tg?.HapticFeedback?.notificationOccurred("error");
    status.textContent = `Ошибка: ${String(e).slice(0, 120)}`;
  } finally {
    btn.disabled = false;
  }
}

renderTerminal();
</script>
</body>
</html>
