# Ruff — линтер и форматтер бэкенда. Конфиг закреплён, чтобы набор правил
# не зависел от версии ruff, которую CI ставит через pip (дефолты меняются
# между релизами). Форматирование — `ruff format`: он black-совместим, поэтому
# отдельный black не нужен и не дублирует зависимости.

line-length = 88
target-version = "py312"

[lint]
# Стабильное ядро: pycodestyle (E4/E7/E9) + pyflakes (F). Не включаем
# preview/эзотерические наборы — они ломают CI при каждом апгрейде ruff и
# размывают сигнал.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Модульные тесты и bootstrap-скрипты сознательно поднимают env/redis перед
# импортом приложения — это требование порядка инициализации, а не случайность.
"test_*.py" = ["E402"]
"alembic/env.py" = ["E402"]
