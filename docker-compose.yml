version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - WAKE_DRY_RUN=true  # осознанно менять на false — не значение по умолчанию нигде
      - LIGHTER_BASE_URL=https://testnet.zklighter.elliot.ai
    env_file:
      - backend/.env  # секреты — не в этом файле, не в git (см. backend/.gitignore)
    volumes:
      - wake-data:/app/data  # wake.db, keystore.enc персистятся между рестартами контейнера

  signing:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uvicorn", "signing_service:app", "--host", "0.0.0.0", "--port", "8787"]
    ports:
      - "8787:8787"
    env_file:
      - backend/.env

volumes:
  wake-data:
