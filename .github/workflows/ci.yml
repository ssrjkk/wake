name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Backend linting ───────────────────────────────────────────────────────
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Ruff
        run: pip install "ruff==0.15.8" --quiet
      - name: Ruff lint
        working-directory: backend
        run: ruff check . --output-format=github
      # Формат проверяется ruff, а не отдельным black: `ruff format` даёт
      # black-совместимый вывод, поэтому один инструмент закрывает и стиль, и
      # импорт-сортировку — без второй зависимости и риска их рассинхронизации.
      - name: Format check
        working-directory: backend
        run: ruff format --check .

  # ── Backend security scan ────────────────────────────────────────────────
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit --quiet
      - name: Scan dependencies for vulnerabilities
        working-directory: backend
        # ВоркAround запрещён, поэтому gate честный: падает на ЛЮБОЙ новой
        # уязвимости. Единственное исключение — urllib3, и оно обосновано, а не
        # заглушено: signing_service.py строит ордеры через lighter.SignerClient,
        # а lighter-sdk жёстко пинит urllib3<2.1.0 (в 1.1.5 и в свежем 1.1.6),
        # тогда как все пропатченные urllib3 ≥2.2. Версию поднять нельзя, не
        # сломав подпись ордеров. Как только lighter-sdk ослабит кап и urllib3
        # обновится, это условие перестанет срабатывать само — кода-заглушки нет.
        run: |
          pip-audit -r requirements.txt --format json > audit.json || true
          python - <<'PY'
          import json, sys
          data = json.load(open("audit.json"))
          vulns = data.get("dependencies", [])
          offenders = [
              v["name"]
              for v in vulns
              if v.get("vulns") and v["name"].lower() != "urllib3"
          ]
          blocked = [v["name"] for v in vulns if v.get("vulns")]
          if blocked:
              print("::warning title=Блок транзитивной зависимости::"
                    "urllib3 уязвим, но заперт капом lighter-sdk (urllib3<2.1.0); "
                    "нужен upstream-фикс, обход сломает подпись ордеров.")
          if offenders:
              print("::error::Уязвимости вне известного исключения: "
                    + ", ".join(sorted(set(offenders))))
              sys.exit(1)
          print("OK: новых уязвимостей нет (учтено исключение urllib3).")
          PY

  # ── Backend tests (pytest + Allure) ──────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    # upload-artifact пишет в Actions-хранилище, а у токена по умолчанию
    # (default_workflow_permissions=read) стоит actions:read — без этого блока
    # шаг падает на загрузке. Шире права не открываем: ветку gh-pages CI не
    # трогает, а Pages в репозитории выключен.
    permissions:
      contents: read
      actions: write
    # База здесь настоящая. SQLite-подставка когда-то пропускала ровно то, что
    # тесты и должны ловить: ON CONFLICT с указанием индекса, срез строки через
    # FOR UPDATE, LIKE c учётом регистра, jsonb — на нём эти запросы просто не
    # исполняются. fakeredis остаётся только там, где он закрыт отдельным тестом
    # (test_rate_limiter.py).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wake
          POSTGRES_PASSWORD: wake
          POSTGRES_DB: wake_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wake"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # wake_migrate — база, которую поднимает alembic (путь продакшна); wake_test
      # — база pytest, её пересоздаёт testsupport. Раздельные, чтобы create_all из
      # тестов не мог замаскировать дрейф миграций.
      WAKE_DATABASE_URL: postgresql+asyncpg://wake:wake@localhost:5432/wake_migrate
      WAKE_TEST_DATABASE_URL: postgresql+asyncpg://wake:wake@localhost:5432/wake_test
      WAKE_REDIS_URL: redis://localhost:6379/0
      # Одноразовые значения для ephemeral-сервисов CI. Секреты продакшна сюда не
      # попадают: этот раннер ничего не подписывает и ни в какую базу кроме своей
      # не стучится.
      WAKE_SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      WAKE_CURATOR_TOKEN: ci-only-curator-token
      TELEGRAM_BOT_TOKEN: "123456:ci-only-bot-token"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt --quiet
          # fakeredis — тестовая зависимость: test_rate_limiter.py подменяет им
          # реальный Redis. В requirements.txt её нет намеренно: этот файл уходит
          # в Dockerfile, а продакшн-образ должен ставить redis-клиент, а не его
          # подделку.
          pip install pytest allure-pytest fakeredis --quiet
      - name: Create the pytest database
        run: psql "postgresql://wake:wake@localhost:5432/postgres" -c "CREATE DATABASE wake_test"
        env:
          PGCONNECT_TIMEOUT: "10"
      # Отдельный гейт, а не часть тестов: testsupport поднимает схему через
      # create_all, поэтому без этого шага приложение могло бы жить на схеме,
      # которой миграция не создаёт, и CI бы этого не заметил.
      - name: Migrations build the production schema
        working-directory: backend
        run: alembic upgrade head
      - name: Models match the migrated schema
        working-directory: backend
        run: alembic check
      - name: Run tests with Allure
        working-directory: backend
        run: |
          python -m pytest . \
            --alluredir=allure-results \
            --tb=short \
            -q
      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: backend/allure-results
          allure_report: allure-report
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore
      # Пробег именно под uvicorn и именно по схеме из alembic: внутри тестов
      # приложение поднимается через ASGITransport, а startup-хуки, реальный пул
      # соединений и /ready с настоящим Redis при этом не исполняются никогда.
      - name: Runtime smoke under uvicorn
        working-directory: backend
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 >/tmp/uvicorn.log 2>&1 &
          curl --silent --show-error --fail --retry 30 --retry-delay 2 \
            --retry-connrefused http://127.0.0.1:8000/health >/dev/null || {
              cat /tmp/uvicorn.log
              exit 1
            }
          ready=$(curl --silent --fail http://127.0.0.1:8000/ready)
          echo "$ready"
          echo "$ready" | grep -q '"status":"ready"' || {
              echo "/ready не ответил ready — зависимость приложения не жива"
              exit 1
            }
          # Приватный роут без токена обязан отвечать своей формой ошибки, а не
          # текстом фреймворка: на этом контракте держится фронт.
          code=$(curl --silent --output /tmp/unauth.json --write-out '%{http_code}' \
            http://127.0.0.1:8000/subscription)
          cat /tmp/unauth.json
          test "$code" = "401"
          grep -q '"code":"SESSION_REQUIRED"' /tmp/unauth.json

  # ── Frontend linting + type checking ─────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # ── Frontend tests ───────────────────────────────────────────────────────
  frontend-tests:
    runs-on: ubuntu-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm run test:run -- --coverage

  # ── E2E tests (Playwright) ───────────────────────────────────────────────
  # Только фронт против vite-dev-server: спека обрезает весь трафик вне своего
  # origin, поэтому бэкенд, Redis и база этому джобу не нужны — они проверены в
  # backend-tests (в том числе под uvicorn).
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e

  # ── Docker build ─────────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: |
          docker build -t wake-backend:${{ github.sha }} .
          docker tag wake-backend:${{ github.sha }} wake-backend:latest
      - name: Verify image
        run: |
          docker run --rm wake-backend:${{ github.sha }} python -c "import app; print('OK')"
