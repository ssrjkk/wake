name: tests

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей бэкенда
        working-directory: backend
        run: |
          pip install -r requirements.txt
      - name: Тесты (включая HTTP smoke через test_api_smoke.py)
        working-directory: backend
        run: |
          python -m unittest discover -v
          python test_db.py
          python test_predict_db.py
          python test_predict_integration.py
          python test_audit_log.py
      # websockets/network-зависимый код (signing_service.py, leader_listener.py)
      # не тестируется здесь автотестами — реальная проверка через тестнет вручную.

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx tsc --noEmit
      # Сборка проверяется отдельным шагом: именно её запускает хостинг фронтенда,
      # и у vite есть ошибки, которых нет у tsc (несобранные динамические импорты).
      - run: npm run build

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run test:run

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
